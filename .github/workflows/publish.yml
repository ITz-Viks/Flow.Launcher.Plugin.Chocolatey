name: Publish Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      # also produces Flow.Launcher.Plugin.Chocolatey.zip (see the Package target in Choco.csproj)
      - name: Build
        run: dotnet build -c Release -o out

      - name: Self-test
        shell: pwsh
        run: ./selftest.ps1

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: plugin.json
          prop_path: Version

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: Flow.Launcher.Plugin.Chocolatey.zip
          tag_name: v${{ steps.version.outputs.prop }}
          generate_release_notes: true
